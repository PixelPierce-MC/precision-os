name: Build PrecisionOS

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository owner
        id: string_ops
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Build and push container image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Containerfile
          push: true
          tags: ghcr.io/${{ steps.string_ops.outputs.owner }}/precision-os:stable

  build-installer-iso:
    needs: build-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase repository owner
        id: string_ops
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Build ISO via ublue-os/isogenerator
        run: |
          mkdir -p output
          sudo podman run \
            --rm \
            --privileged \
            --pull=newer \
            --security-opt label=type:unconfined_t \
            -e IMAGE_REPO="ghcr.io/${{ steps.string_ops.outputs.owner }}" \
            -e IMAGE_NAME="precision-os" \
            -e IMAGE_TAG="stable" \
            -e VERSION="41" \
            -e ISO_NAME="precision-os-installer.iso" \
            -v "$(pwd)/output:/isogenerator/output" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            ghcr.io/ublue-os/isogenerator:latest

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: precision-os-iso
          path: output/*.iso
