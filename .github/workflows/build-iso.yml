name: Build PrecisionOS (image + ISOs)

on:
  workflow_dispatch:
    inputs:
      build_installer_iso:
        description: "Installer ISO (Anaconda, Flatpaks baked in). Verified path."
        type: boolean
        default: true
      build_live_iso:
        description: "Live ISO (boots to a desktop, Mint-style). Experimental."
        type: boolean
        default: false
      fedora_version:
        description: "Override Fedora major version for the installer ISO (blank = auto-detect)"
        type: string
        default: ""
  push:
    branches: [main]
    paths: ["Containerfile", "build_files/**", "system_files/**"]
  schedule:
    - cron: "30 4 * * 2"   # weekly image rebuild to follow Bazzite upstream (ISOs stay manual)

env:
  IMAGE_NAME: precision-os
  BASE_IMAGE: ghcr.io/ublue-os/bazzite-gnome-nvidia
  BASE_TAG: latest
  FLATPAK_LIST: system_files/usr/share/precision-os/flatpaks.list   # single source of truth

jobs:
  build-image:
    runs-on: ubuntu-24.04
    permissions: { contents: read, packages: write, id-token: write }
    outputs:
      owner: ${{ steps.vars.outputs.owner }}
    steps:
steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/checkout@v4
      - id: vars
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build
        id: build
        uses: redhat-actions/buildah-build@v2
        with:
          containerfiles: ./Containerfile
          image: ${{ env.IMAGE_NAME }}
          tags: latest ${{ github.sha }}
          oci: false
          layers: false
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
            BASE_TAG=${{ env.BASE_TAG }}

      - name: Push to GHCR
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build.outputs.image }}
          tags: ${{ steps.build.outputs.tags }}
          registry: ghcr.io/${{ steps.vars.outputs.owner }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # After the first push: GitHub > Packages > precision-os > Package settings > Public.

  # ---------------------------------------------------------------------------
  # Installer ISO: boots Anaconda and installs the image. Flatpaks listed in flatpaks.list are
  # embedded in the ISO and installed onto the target system (default system install).
  # ---------------------------------------------------------------------------
  build-installer-iso:
    needs: build-image
    if: github.event_name == 'workflow_dispatch' && inputs.build_installer_iso
    runs-on: ubuntu-24.04
    permissions: { contents: read, packages: read }
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (ISO build needs ~40 GB)
        uses: jlumbroso/free-disk-space@v1.3.1
        with: { tool-cache: true, android: true, dotnet: true, haskell: true, large-packages: false, swap-storage: true }

      - name: Resolve Flatpak dependency closure inside the image
        run: |
          mkdir -p flatpaks_in flatpak_refs
          cp "$FLATPAK_LIST" flatpaks_in/flatpaks.list
          cat > resolve.sh <<'EOS'
          #!/usr/bin/bash
          set -euo pipefail
          flatpak remote-add --system --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --system -y --noninteractive $(tr '\n' ' ' < /input/flatpaks.list)
          # MangoHud Vulkan layer for every freedesktop runtime branch pulled in above
          for b in $(flatpak list --system --runtime --columns=application,branch | awk '$1=="org.freedesktop.Platform"{print $2}' | sort -u); do
            flatpak install --system -y --noninteractive flathub "org.freedesktop.Platform.VulkanLayer.MangoHud//$b" || true
          done
          ostree refs --repo="${FLATPAK_SYSTEM_DIR}/repo" | grep '^deploy/' \
            | grep -v 'org\.freedesktop\.Platform\.openh264' | sed 's/^deploy\///' > /output/flatpaks_with_deps
          EOS
          chmod +x resolve.sh
          image="ghcr.io/${{ needs.build-image.outputs.owner }}/${IMAGE_NAME}:latest"
          docker run --rm --privileged --entrypoint bash \
            -e FLATPAK_SYSTEM_DIR=/flatpak/flatpak -e FLATPAK_TRIGGERSDIR=/flatpak/triggers \
            -v "$PWD/resolve.sh:/resolve.sh:ro" -v "$PWD/flatpaks_in:/input:ro" -v "$PWD/flatpak_refs:/output" \
            "$image" /resolve.sh
          docker rmi "$image"
          echo "Flatpak refs to embed:"; cat flatpak_refs/flatpaks_with_deps

      - name: Detect Fedora major version from base image
        id: ver
        run: |
          if [ -n "${{ inputs.fedora_version }}" ]; then v="${{ inputs.fedora_version }}"; else
            v=$(skopeo inspect docker://${BASE_IMAGE}:${BASE_TAG} | jq -r '.Labels["org.opencontainers.image.version"]' | cut -d. -f1)
          fi
          echo "Fedora version: $v"; echo "fedora=$v" >> "$GITHUB_OUTPUT"

      - name: Build installer ISO
        id: iso
        uses: jasonn3/build-container-installer@v1.2.0   # check Releases for a newer tag
        with:
          arch: x86_64
          image_name: ${{ env.IMAGE_NAME }}
          image_repo: ghcr.io/${{ needs.build-image.outputs.owner }}
          image_tag: latest
          variant: Silverblue                 # GNOME
          version: ${{ steps.ver.outputs.fedora }}
          secure_boot_key_url: https://github.com/ublue-os/akmods/raw/main/certs/public_key.der
          enrollment_password: ublue-os
          iso_name: precision-os-installer.iso
          flatpak_remote_name: flathub
          flatpak_remote_url: https://flathub.org/repo/flathub.flatpakrepo
          flatpak_remote_refs_dir: flatpak_refs
          enable_flatpak_dependencies: "false"   # closure already resolved above
          enable_cache_dnf: "false"
          enable_cache_skopeo: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: precision-os-installer-iso
          path: |
            ${{ steps.iso.outputs.iso_path }}/${{ steps.iso.outputs.iso_name }}
            ${{ steps.iso.outputs.iso_path }}/${{ steps.iso.outputs.iso_name }}-CHECKSUM
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Live ISO (Titanoboa): boots to a PrecisionOS desktop with an "Install PrecisionOS" launcher.
  # Modeled on Bluefin's ISO pipeline: titanoboa + hook-post-rootfs (iso_files/configure_iso_anaconda.sh)
  # installs anaconda-live and an interactive kickstart. EXPERIMENTAL: test in a VM before trusting it.
  # Install needs internet (the kickstart pulls the image from GHCR); the image package must be Public.
  # ---------------------------------------------------------------------------
  build-live-iso:
    needs: build-image
    if: github.event_name == 'workflow_dispatch' && inputs.build_live_iso
    runs-on: ubuntu-24.04
    permissions: { contents: read, packages: read }
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: ublue-os/remove-unwanted-software@v9

      - name: Render live-ISO hook (inject image reference)
        run: |
          IMAGE_REF="ghcr.io/${{ needs.build-image.outputs.owner }}/${IMAGE_NAME}:latest"
          sed -i "s|@IMAGE_REF@|${IMAGE_REF}|g" iso_files/configure_iso_anaconda.sh
          bash -n iso_files/configure_iso_anaconda.sh
          grep -n '^IMAGE_REF=' iso_files/configure_iso_anaconda.sh
          ! grep -q '@IMAGE_REF@' iso_files/configure_iso_anaconda.sh

      - name: Build live ISO
        id: live
        uses: ublue-os/titanoboa@main      # pin to a commit SHA once you have a build you trust
        with:
          image-ref: ghcr.io/${{ needs.build-image.outputs.owner }}/${{ env.IMAGE_NAME }}:latest
          hook-post-rootfs: ${{ github.workspace }}/iso_files/configure_iso_anaconda.sh

      - name: Checksum
        run: |
          mkdir -p output
          mv "${{ steps.live.outputs.iso-dest }}" output/precision-os-live.iso
          (cd output && sha256sum precision-os-live.iso | tee precision-os-live.iso-CHECKSUM)

      - uses: actions/upload-artifact@v4
        with:
          name: precision-os-live-iso
          path: output/*
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
