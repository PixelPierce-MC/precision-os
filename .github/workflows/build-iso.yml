name: Build PrecisionOS

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository owner
        id: string_ops
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Build and push container image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Containerfile
          push: true
          tags: ghcr.io/${{ steps.string_ops.outputs.owner }}/precision-os:stable

  build-installer-iso:
    needs: build-image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase repository owner
        id: string_ops
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Build Installer ISO with build-container-installer
        run: |
          mkdir -p output release-files
          sudo podman rm -f iso-builder || true
          sudo podman run \
            --name iso-builder \
            --privileged \
            --pull=newer \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            ghcr.io/jasonn3/build-container-installer:v1.5.0 \
            IMAGE_REPO="ghcr.io/${{ steps.string_ops.outputs.owner }}" \
            IMAGE_NAME="precision-os" \
            IMAGE_TAG="stable" \
            VARIANT="Kinoite" \
            ISO_NAME="precision-os.iso"

          # Copy the generated ISO and checksum directly from the container's working directory
          sudo podman cp iso-builder:/build-container-installer/precision-os.iso output/precision-os.iso
          sudo podman cp iso-builder:/build-container-installer/precision-os.iso-CHECKSUM output/precision-os.iso-CHECKSUM || true
          sudo podman rm -f iso-builder

          sudo chown -R $USER:$USER output
          ls -lh output/

          # Split into < 2GB chunks for GitHub Releases (GitHub has a 2GB per-asset limit)
          split -b 1900M -d output/precision-os.iso release-files/precision-os.iso.part
          cp output/precision-os.iso-CHECKSUM release-files/ || true
          ls -lh release-files/

      - name: Upload Full ISO Artifact (Single File)
        uses: actions/upload-artifact@v4
        with:
          name: precision-os-iso
          path: output/precision-os.iso
          retention-days: 7

      - name: Publish Split ISO to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-iso
          name: PrecisionOS Latest ISO
          prerelease: true
          files: release-files/*
