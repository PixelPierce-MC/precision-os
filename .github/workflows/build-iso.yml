name: Build PrecisionOS

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository owner
        id: string_ops
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Build and push container image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Containerfile
          push: true
          tags: ghcr.io/${{ steps.string_ops.outputs.owner }}/precision-os:stable

  build-installer-iso:
    needs: build-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase repository owner
        id: string_ops
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Pull image and build ISO
        run: |
          mkdir -p output
          sudo podman pull ghcr.io/${{ steps.string_ops.outputs.owner }}/precision-os:stable

          # Extract the target Fedora release version from the image
          VERSION_ID=$(sudo podman run --rm ghcr.io/${{ steps.string_ops.outputs.owner }}/precision-os:stable grep -oP '(?<=^VERSION_ID=).+' /etc/os-release | tr -d '"')
          echo "Detected Fedora version: $VERSION_ID"

          # Create standard Fedora repo files so bootc-image-builder can resolve installer RPMs
          mkdir -p bib-repos
          cat << REPO > bib-repos/fedora.repo
          [fedora]
          name=Fedora \$releasever - \$basearch
          metalink=https://mirrors.fedoraproject.org/metalink?repo=fedora-${VERSION_ID}&arch=x86_64
          enabled=1
          gpgcheck=0

          [updates]
          name=Fedora \$releasever - \$basearch - Updates
          metalink=https://mirrors.fedoraproject.org/metalink?repo=updates-released-f${VERSION_ID}&arch=x86_64
          enabled=1
          gpgcheck=0
          REPO

          sudo podman run \
            --rm \
            --privileged \
            --pull=newer \
            --security-opt label=type:unconfined_t \
            -v "$(pwd)/output:/output" \
            -v "$(pwd)/bib-repos:/etc/yum.repos.d:ro" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type iso \
            --rootfs btrfs \
            --use-librepo=True \
            ghcr.io/${{ steps.string_ops.outputs.owner }}/precision-os:stable

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: precision-os-iso
          path: output/bootiso/*.iso
