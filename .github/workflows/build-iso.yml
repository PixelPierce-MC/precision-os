cat << 'EOF' > ~/PrecisionOS/.github/workflows/build-iso.yml
name: Build PrecisionOS (image + ISOs)

on:
  workflow_dispatch:
    inputs:
      build_installer_iso:
        description: "Installer ISO (Anaconda, Flatpaks baked in). Verified path."
        type: boolean
        default: true
      build_live_iso:
        description: "Live ISO (boots to a desktop, Mint-style). Experimental."
        type: boolean
        default: false
      fedora_version:
        description: "Override Fedora major version for the installer ISO (blank = auto-detect)"
        type: string
        default: ""
  push:
    branches: [main]
    paths: ["Containerfile", "build_files/**", "system_files/**"]
  schedule:
    - cron: "30 4 * * 2"

env:
  IMAGE_NAME: precision-os
  BASE_IMAGE: ghcr.io/ublue-os/bazzite-gnome-nvidia
  BASE_TAG: latest
  FLATPAK_LIST: system_files/usr/share/precision-os/flatpaks.list

jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image_tag: ${{ steps.image_data.outputs.image_tag }}
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set owner lowercase
        id: image_data
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "image_tag=latest" >> "$GITHUB_OUTPUT"

      - name: Build
        uses: redhat-actions/buildah-build@v2
        with:
          containerfiles: |
            Containerfile
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.image_data.outputs.image_tag }}
          oci: true

      - name: Push to GHCR
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.image_data.outputs.image_tag }}
          registry: ghcr.io/${{ steps.image_data.outputs.owner }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
EOF
